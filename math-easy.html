<!DOCTYPE html>
<html>
<head>
    <title>Mathematics - Easy Test</title>
</head>

<body>

    <h1>Basic Engineering Mathematics</h1>

    <h2>Easy Level</h2>

    <p id="questionNumber"></p>

    <h3 id="question"></h3>

    <div id="options"></div>

    <p id="result"></p>

    <button id="nextButton" onclick="nextQuestion()">
        Next Question
    </button>

    <br><br>

    <button onclick="window.location.href='math-test.html'">
        Back to Difficulty
    </button>


<script>

const questions = [

    {
        question: "What is the determinant of [[2, 1], [3, 4]]?",
        options: ["3", "5", "8", "11"],
        answer: 1
    },

    {
        question: "What is the value of 2² + 3²?",
        options: ["9", "12", "13", "15"],
        answer: 2
    },

    {
        question: "What is the derivative of x²?",
        options: ["x", "2x", "x²", "2"],
        answer: 1
    },

    {
        question: "What is the value of sin 90°?",
        options: ["0", "1", "-1", "2"],
        answer: 1
    },

    {
        question: "What is the square root of 144?",
        options: ["10", "11", "12", "14"],
        answer: 2
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;


function showQuestion() {

    answered = false;

    document.getElementById("result").innerHTML = "";

    document.getElementById("questionNumber").innerHTML =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    document.getElementById("question").innerHTML =
        questions[currentQuestion].question;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    questions[currentQuestion].options.forEach(function(option, index) {

        const button = document.createElement("button");

        button.innerHTML = option;

        button.onclick = function() {
            checkAnswer(index);
        };

        optionsDiv.appendChild(button);

        optionsDiv.appendChild(document.createElement("br"));
        optionsDiv.appendChild(document.createElement("br"));

    });
}


function checkAnswer(selectedAnswer) {

    if (answered) {
        return;
    }

    answered = true;

    if (selectedAnswer === questions[currentQuestion].answer) {

        score++;

        document.getElementById("result").innerHTML =
            "Correct! ✅";

    } else {

        document.getElementById("result").innerHTML =
            "Wrong! ❌";

    }

}


function nextQuestion() {

    if (!answered) {

        document.getElementById("result").innerHTML =
            "Please select an answer first.";

        return;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        document.getElementById("questionNumber").innerHTML =
            "Test Completed 🎉";

        document.getElementById("question").innerHTML =
            "Your Score: " + score + " / " + questions.length;

        document.getElementById("options").innerHTML = "";

        document.getElementById("result").innerHTML =
            "Well done!";

        document.getElementById("nextButton").style.display = "none";

    }

}


showQuestion();

</script>

</body>
</html>
